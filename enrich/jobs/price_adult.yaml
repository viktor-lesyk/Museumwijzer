field: price_adult
title: "Standard Single-Entry Adult Ticket"
description_en: >-
  Standard single-entry adult ticket price for the museum itself.
  Must be regular individual adult admission. Never combo, combi, duo, or joint tickets with other attractions.
  If the museum only sells combo tickets, set status to 'combo_only' and admission to 'unknown'.
  If admission is free for everyone, set status to 'free' and admission to 'free' with an explicit quote stating free general admission (free-for-children does NOT qualify as free admission).
description_nl: >-
  Standaard individueel toegangskaartje voor een volwassene voor het museum zelf.
  Nooit combinatie-, duo- of combinatietickets met andere attracties.
output_schema:
  type: object
  properties:
    admission:
      type: string
      enum: ["free", "paid", "unknown"]
      description: "Whether general admission is free for all adults, paid, or unknown."
    status:
      type: string
      enum: ["paid", "free", "closed", "combo_only", "blocked_by_bot_protection", "blocked_by_robots", "unknown"]
      description: "Operational/ticketing status."
    adult_eur:
      type: ["number", "null"]
      description: "Standard adult price in EUR. Must be 1.00 - 45.00 for paid, 0.0 for free, null otherwise."
    quote:
      type: ["string", "null"]
      description: "Literal quote from the page supporting the price/status (maximum 15 words)."
    source_url:
      type: ["string", "null"]
      description: "Exact URL where the price and quote were found."
    reason:
      type: string
      description: "Short explanation of how the price or status was determined."
    confidence:
      type: string
      enum: ["high", "medium", "low", "blocked_by_bot_protection", "blocked_by_robots"]
      description: "Calibrated confidence level."
    entered_by:
      type: string
      enum: ["agent", "manual"]
      description: "Whether the record was extracted by the automated agent or manually entered."
  required: ["admission", "status", "reason", "confidence"]
plausibility:
  min_paid_eur: 1.00
  max_paid_eur: 45.00
  forbidden_quote_keywords:
    - combo
    - combi
    - duo
    - gezamenlijk
confidence_rules:
  high: "Single clearly labelled adult ticket price found directly on official static ticket/pricing page."
  medium: "Multi-tier pricing (e.g. castle vs garden, peak/off-peak, online vs desk), secondary subpage, or complex options."
  low: "Inferred or uncertain price."
refresh_interval_days: 540
