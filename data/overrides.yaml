museumstoomtram-hoorn-medemblik:
  date: "2026-09-21"
  evidence_url: "https://www.stoomtram.nl/contact/"
  exact_text_read: "Bezoekadres / Hoorn Tramstation: Van Dedemstraat 8 1624 NN Hoorn"
  note: >-
    Source website CMS entry duplicated Museum BroekerVeiling address and lacked website.
    Address reconciliation: The workshop and depot are at Van Linschotenstraat 21, 1625 HK Hoorn, while the official public visitor entrance, ticket office, and tram departure point is Van Dedemstraat 8, 1624 NN Hoorn ("Bezoekadres / Hoorn Tramstation: Van Dedemstraat 8 1624 NN Hoorn").
    This heritage railway is a multi-site line between Hoorn and Medemblik, with additional station/jetty locations at Dam 2, 1671 AW Medemblik ("Medemblik tramstation en aanlegsteiger: Dam 2, 1671 AW Medemblik") and Tritondam 5, 1601 GT Enkhuizen ("Enkhuizen aanlegsteiger: Tritondam 5, 1601 GT Enkhuizen"). We list the primary visitor entrance in Hoorn (Van Dedemstraat 8, 1624 NN Hoorn).
  override:
    duplicate_of: "museumstoomtram"
    address:
      street: "Van Dedemstraat 8"
      postcode: "1624 NN"
      city: "Hoorn"
    museum_website: "https://www.stoomtram.nl/"

