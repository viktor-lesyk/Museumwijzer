name = "museumwijzer-sync"
main = "worker.js"
compatibility_date = "2024-01-01"

# KV Namespace binding for anonymous sync codes
# Run: npx wrangler kv:namespace create "MUSEUM_SYNC_KV"
# Paste the resulting id below:
[[kv_namespaces]]
binding = "MUSEUM_SYNC_KV"
id = "c925fb8d2a034924bf1cb549ee751316"

# Optional Custom Domain / Route under your vlesyk.com zone:
# routes = [
#   { pattern = "sync.museumwijzer.vlesyk.com/*", zone_name = "vlesyk.com" }
# ]
